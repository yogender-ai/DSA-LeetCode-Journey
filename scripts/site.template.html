<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{URL}}">
<meta name="author" content="Yogender">
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
<meta name="keywords" content="{{KEYWORDS}}">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Yogender — DSA Journey">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{URL}}">
<meta property="og:image" content="{{IMAGE}}">
<meta property="og:image:alt" content="An algorithm executing step by step">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESCRIPTION}}">
<meta name="twitter:image" content="{{IMAGE}}">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">

<script type="application/ld+json">
{{JSONLD}}
</script>

<style>
  :root{
    --bg:#05060f; --panel:#0b0d1a; --edge:#1e1b4b;
    --violet:#8b5cf6; --cyan:#22d3ee; --pink:#f472b6;
    --lime:#a3e635; --amber:#fbbf24; --teal:#2dd4bf;
    --text:#e2e8f0; --muted:#94a3b8; --dim:#475569;
    --sans:'Segoe UI','SF Pro Display',system-ui,-apple-system,sans-serif;
    --mono:'JetBrains Mono','Cascadia Code','SF Mono',Consolas,Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
       -webkit-font-smoothing:antialiased;line-height:1.5}
  a{color:inherit}
  .wrap{max-width:1100px;margin:0 auto;padding:0 16px 64px}

  header{padding:40px 0 24px;border-bottom:1px solid var(--edge);margin-bottom:24px}
  h1{margin:0 0 4px;font-size:clamp(26px,5vw,38px);letter-spacing:-.5px}
  h1 .grad{background:linear-gradient(90deg,var(--violet),var(--cyan),var(--pink));
           -webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--muted);font-size:14px;font-family:var(--mono)}
  .sub a{color:var(--cyan);text-decoration:none}
  .sub a:hover{text-decoration:underline}
  .lede{color:var(--muted);font-size:15px;max-width:70ch;margin:14px 0 0}

  .replay{margin:24px 0 0;padding:0}
  .replay img{width:100%;border-radius:18px;display:block}
  .replay figcaption{color:var(--muted);font:500 12px var(--mono);margin-top:8px;text-align:center}

  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:24px 0}
  .tile{background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:14px 16px}
  .tile .k{font:700 11px var(--mono);letter-spacing:1.4px;text-transform:uppercase}
  .tile .v{font-size:26px;font-weight:800;margin-top:6px}
  .tile .m{font-size:12px;color:var(--muted);font-family:var(--mono)}

  h2{font-size:20px;margin:32px 0 4px}
  .controls{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 18px;position:sticky;top:0;
            background:linear-gradient(var(--bg) 70%,transparent);padding:12px 0;z-index:5}
  input[type=search],select{background:var(--panel);color:var(--text);border:1px solid var(--edge);
    border-radius:10px;padding:10px 12px;font-size:14px;font-family:var(--sans);outline:none}
  input[type=search]{flex:1 1 260px}
  input[type=search]:focus,select:focus{border-color:var(--violet);
    box-shadow:0 0 0 3px color-mix(in srgb,var(--violet) 25%,transparent)}
  .count{color:var(--muted);font:600 13px var(--mono);align-self:center;margin-left:auto}

  ul.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
  ul.list li{background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:14px 16px;
     display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;
     transition:border-color .15s,transform .15s}
  ul.list li:hover{border-color:var(--violet);transform:translateY(-1px)}
  .num{font:700 13px var(--mono);color:var(--dim);min-width:52px}
  .title{font-weight:600}
  .title a{text-decoration:none}
  .title a:hover{color:var(--cyan)}
  .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .chip{font:600 11px var(--mono);padding:3px 8px;border-radius:999px;border:1px solid}
  .Easy{color:var(--lime);border-color:color-mix(in srgb,var(--lime) 40%,transparent)}
  .Medium{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 40%,transparent)}
  .Hard{color:var(--pink);border-color:color-mix(in srgb,var(--pink) 40%,transparent)}
  .Lesson{color:var(--teal);border-color:color-mix(in srgb,var(--teal) 40%,transparent)}
  .pat{color:var(--violet);border-color:color-mix(in srgb,var(--violet) 35%,transparent)}
  .lang{color:var(--cyan);border-color:color-mix(in srgb,var(--cyan) 35%,transparent)}
  .src{color:var(--muted);border-color:var(--edge);text-decoration:none}
  .date{font:600 12px var(--mono);color:var(--muted);white-space:nowrap}
  .empty{text-align:center;color:var(--muted);padding:48px 0;font-family:var(--mono)}
  footer{margin-top:40px;color:var(--dim);font:500 12px var(--mono);text-align:center}
  footer a{color:var(--muted)}

  @media (max-width:640px){
    ul.list li{grid-template-columns:auto 1fr;}
    .date{grid-column:2;justify-self:start}
    .controls{position:static}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1><span class="grad">DSA &amp; LeetCode Journey</span></h1>
    <div class="sub">
      by <a href="https://github.com/yogender-ai">Yogender</a> ·
      <a href="https://leetcode.com/u/{{LEETCODE_USER}}/">@{{LEETCODE_USER}}</a> on LeetCode ·
      <a href="https://github.com/{{REPO}}">source on GitHub</a>
    </div>
    <p class="lede">{{DESCRIPTION}}</p>
  </header>

  <figure class="replay">
    <img src="algo_replay.svg" alt="{{ALGO_ALT}}" width="1200" height="330">
    <figcaption>The algorithm is really executed at build time; every comparison and
    pointer move it makes becomes a frame. A different one each day.</figcaption>
  </figure>

  <div class="tiles">{{TILES}}</div>

  <h2 id="all-solutions">All {{COUNT}} solutions</h2>

  <div class="controls">
    <label class="sr-only" for="q" hidden>Search solutions</label>
    <input type="search" id="q" placeholder="Search by name, number or pattern…" autocomplete="off" spellcheck="false">
    <select id="diff" aria-label="Filter by difficulty"><option value="">All difficulties</option>{{OPT_DIFF}}</select>
    <select id="pat" aria-label="Filter by pattern"><option value="">All patterns</option>{{OPT_PAT}}</select>
    <select id="lang" aria-label="Filter by language"><option value="">All languages</option>{{OPT_LANG}}</select>
    <span class="count" id="count">{{COUNT}} of {{COUNT}}</span>
  </div>

  <ul class="list" id="list">
{{ROWS}}
  </ul>
  <div class="empty" id="empty" hidden>Nothing matches that.</div>

  <footer>
    generated {{GENERATED}} · rebuilt automatically on every push ·
    <a href="problems.json">problems.json</a> ·
    <a href="https://github.com/{{REPO}}">{{REPO}}</a>
  </footer>
</div>

<script>
// The rows are already in the HTML so the page works, and indexes, without
// JavaScript. This only filters what is on the page.
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var rows = [].slice.call(document.querySelectorAll('#list > li'));
  var total = rows.length;

  function render() {
    var q = $('q').value.trim().toLowerCase();
    var d = $('diff').value, p = $('pat').value, l = $('lang').value;
    var shown = 0;

    rows.forEach(function (li) {
      var ok = (!d || li.dataset.diff === d)
            && (!p || li.dataset.pattern === p)
            && (!l || li.dataset.lang === l)
            && (!q || li.dataset.search.indexOf(q) !== -1);
      li.hidden = !ok;
      if (ok) shown++;
    });

    $('count').textContent = shown + ' of ' + total;
    $('empty').hidden = shown > 0;
  }

  ['q', 'diff', 'pat', 'lang'].forEach(function (id) {
    $(id).addEventListener('input', render);
  });
})();
</script>
</body>
</html>
