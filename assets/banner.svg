<style>
  .tk{font-family:'JetBrains Mono', 'Cascadia Code', 'SF Mono', Consolas, Menlo, monospace;opacity:0;animation:up linear infinite}
  @keyframes up{0%{transform:translateY(0);opacity:0}15%{opacity:.16}85%{opacity:.16}100%{transform:translateY(-360px);opacity:0}}
  .t{font:800 64px 'Segoe UI', 'SF Pro Display', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;text-anchor:middle;letter-spacing:2px} .k{font:700 14px 'JetBrains Mono', 'Cascadia Code', 'SF Mono', Consolas, Menlo, monospace;letter-spacing:6px;fill:#94a3b8;text-anchor:middle}
  .rl{font:500 20px 'JetBrains Mono', 'Cascadia Code', 'SF Mono', Consolas, Menlo, monospace;fill:#22d3ee;text-anchor:middle;opacity:0;animation:rl 12s infinite}
  @keyframes rl{0%{opacity:0;transform:translateY(12px)}3%,22%{opacity:1;transform:none}25%,100%{opacity:0;transform:translateY(-12px)}}
  .o1{animation:o1 12s ease-in-out infinite} .o2{animation:o2 15s ease-in-out infinite}
  @keyframes o1{50%{transform:translate(220px,40px)}} @keyframes o2{50%{transform:translate(-240px,-30px)}}
</style>
