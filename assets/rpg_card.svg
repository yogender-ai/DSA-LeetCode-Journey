<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Player Profile: Level 17 Grandmaster Alchemist 👑"><title>Player Profile: Level 17 Grandmaster Alchemist 👑</title>
<defs>
  <linearGradient id="xp_grad" x1="0" x2="1"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#22d3ee"/></linearGradient>
</defs>
<style>
  .card_title{font:800 24px 'Segoe UI', 'SF Pro Display', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;fill:#e2e8f0}
  .tag{font:700 11px 'JetBrains Mono', 'Cascadia Code', 'SF Mono', Consolas, Menlo, monospace;letter-spacing:2px;fill:#fbbf24}
  .stat_lbl{font:600 13px 'JetBrains Mono', 'Cascadia Code', 'SF Mono', Consolas, Menlo, monospace;fill:#94a3b8}
  .stat_val{font:800 28px 'Segoe UI', 'SF Pro Display', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;fill:#e2e8f0}
  .badge{font:700 12px 'JetBrains Mono', 'Cascadia Code', 'SF Mono', Consolas, Menlo, monospace;fill:#e2e8f0}
</style>
<rect x=".5" y=".5" width="1199" height="259" rx="18" fill="#0b0d1a" stroke="#1e1b4b"/>
<g transform="translate(40, 36)">
  <text x="0" y="0" class="tag">// PLAYER PROFILE &amp; RPG LEVEL</text>
  <text x="0" y="34" class="card_title">Level 17 — Grandmaster Alchemist 👑</text>
  <text x="0" y="62" class="stat_lbl">Total EXP: <tspan fill="#22d3ee">6,700 XP</tspan> · Progress to Level 18: <tspan fill="#a3e635">36.4%</tspan></text>
  
  <!-- XP Bar -->
  <rect x="0" y="80" width="700" height="16" rx="8" fill="#1e1b4b"/>
  <rect x="0" y="80" width="254.79999999999998" height="16" rx="8" fill="url(#xp_grad)"/>
  <text x="720" y="93" class="stat_lbl">6,700 / 7,225 XP</text>

  <!-- Small Stats Grid -->
  <g transform="translate(0, 120)">
    <text x="0" y="16" class="stat_lbl">CONTEST RATING</text>
    <text x="0" y="44" class="stat_val">1585.61</text>
    <text x="0" y="62" class="stat_lbl" fill="#2dd4bf">Top 26.49% · 14 Contests</text>

    <text x="240" y="16" class="stat_lbl">TOTAL PROBLEMS</text>
    <text x="240" y="44" class="stat_val">278</text>
    <text x="240" y="62" class="stat_lbl">261 files tracked</text>

    <text x="480" y="16" class="stat_lbl">PRACTICE STREAK</text>
    <text x="480" y="44" class="stat_val" fill="#a3e635">🔥 74 Days</text>
    <text x="480" y="62" class="stat_lbl">Consistency Rank: S-Tier</text>
  </g>
</g>

<!-- Achievement Shield Box -->
<g transform="translate(860, 32)">
  <rect width="300" height="196" rx="14" fill="#05060f" stroke="#1e1b4b"/>
  <text x="20" y="32" class="tag" fill="#f472b6">// ACTIVE QUESTS</text>
  <text x="20" y="65" class="badge">⚔️ Quest: Path to 300 Solved</text>
  <text x="20" y="85" class="stat_lbl" font-size="12">278/300 problems (93% complete)</text>
  <rect x="20" y="95" width="260" height="6" rx="3" fill="#1e1b4b"/>
  <rect x="20" y="95" width="242" height="6" rx="3" fill="#f472b6"/>

  <text x="20" y="130" class="badge">🔥 Quest: Century Flame (100d)</text>
  <text x="20" y="150" class="stat_lbl" font-size="12">74/100 streak days (74% complete)</text>
  <rect x="20" y="160" width="260" height="6" rx="3" fill="#1e1b4b"/>
  <rect x="20" y="160" width="192" height="6" rx="3" fill="#a3e635"/>
</g>
</svg>
